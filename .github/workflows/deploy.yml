name: deploy

# 部署方案 A（与 zmzai-cloud / muzhi 等一致）：构建在 GitHub 托管 runner 完成，
# 产物直传香港服务器秒切。服务器端只做：解压 → 软链切换 → pm2 重启
# （见 /opt/zmzai/scripts/receive-deploy.sh）。
# 进程名是 arena（deploy-targets.sh 里 arena|zmzai-arena|3000|arena.zmzai.cloud）。

"on":
  push:
    branches: [main]
  workflow_dispatch: {}
  # A 股收盘后自动刷新实盘行情并重新部署（北京时间 17:10 = UTC 09:10，交易日）
  schedule:
    - cron: "10 9 * * 1-5"

env:
  APP_NAME: arena
  HK_HOST: 149.88.84.189
  HK_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # corepack 本地跑 install 会自动写回 package.json packageManager 字段，
      # 与 action-setup 固定 version 冲突。必须在 action-setup 之前剥离。
      - name: Strip packageManager (corepack auto-pin)
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(p.packageManager){delete p.packageManager;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')}"

      # 固定 pnpm 10.34.5 与服务器一致：pnpm 11 会把被忽略的构建脚本当硬错误。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_FETCH_TIMEOUT: "300000"
          PNPM_FETCH_RETRIES: "5"

      - name: Restore production env for build
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            ${HK_USER}@${HK_HOST} "envget ${APP_NAME}" > .env.production

      # 刷新 A 股实盘日 K（前复权）：经 HK 服务器网关拉取腾讯行情，生成
      # src/data/market-real.ts；任一源失败时保留仓库快照，不阻断构建
      - name: Refresh real A-share market data
        run: node scripts/fetch-market.mjs
        env:
          MARKET_FETCH_SSH_HOST: ${{ env.HK_HOST }}
          MARKET_FETCH_SSH_USER: ${{ env.HK_USER }}

      - name: Build
        run: pnpm build

      - name: Pack artifact
        run: |
          FILES=".next package.json pnpm-lock.yaml"
          [ -e pnpm-workspace.yaml ] && FILES="$FILES pnpm-workspace.yaml"
          for p in next.config.ts next.config.mjs next.config.js public messages content scripts middleware.ts src; do
            [ -e "$p" ] && FILES="$FILES $p"
          done
          tar -czf /tmp/${APP_NAME}-${{ github.sha }}.tar.gz \
            --exclude='node_modules' --exclude='.git' --exclude='.next/cache' \
            --exclude='.env*' --exclude='.vercel' $FILES
          # 本地产物完整性校验：打包损坏（磁盘/缓存异常）在 CI 侧直接暴露，不传到服务器
          gzip -t /tmp/${APP_NAME}-${{ github.sha }}.tar.gz || exit 1

      - name: Upload & deploy to HK server
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          # 服务器 store 内建 gzip -t 校验：传输截断的坏包立即删除并中止，不会进入 deploy
          #（历史上 ssh 传输截断静默落盘坏包，曾导致 deploy 解压失败与 CI 挂起）
          ssh $SSH_OPTS ${HK_USER}@${HK_HOST} "store ${APP_NAME} ${{ github.sha }}" \
            < /tmp/${APP_NAME}-${{ github.sha }}.tar.gz
          ssh $SSH_OPTS ${HK_USER}@${HK_HOST} "deploy ${APP_NAME} ${{ github.sha }}"
